# Public read-only endpoints used by the Kadena homepage.
limit_req_zone $binary_remote_addr zone=nodeapi:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name node.kadena.ws;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/node.kadena.ws;
    }

    location ~ ^/(info|health-check|chainweb/0\.0/mainnet01/cut)$ {
        limit_except GET { deny all; }
        limit_req zone=nodeapi burst=20 nodelay;
        proxy_pass http://127.0.0.1:1848;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
