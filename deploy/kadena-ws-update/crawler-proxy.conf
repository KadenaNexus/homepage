# Fixed, same-origin read-only routes to the community crawler.
# Resolve the crawler during requests so a temporary DNS outage cannot prevent
# nginx from starting. Preserve query arguments explicitly with variable URLs.
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;

location = /api/kdascan/nodes {
    limit_except GET { deny all; }
    set $kdascan kdascan.dnns.es;
    proxy_pass https://$kdascan/api/nodos$is_args$args;
    proxy_set_header Host kdascan.dnns.es;
    proxy_ssl_server_name on;
    proxy_ssl_name kdascan.dnns.es;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_redirect off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

location = /api/kdascan/history {
    limit_except GET { deny all; }
    set $kdascan kdascan.dnns.es;
    proxy_pass https://$kdascan/api/historial$is_args$args;
    proxy_set_header Host kdascan.dnns.es;
    proxy_ssl_server_name on;
    proxy_ssl_name kdascan.dnns.es;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_redirect off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
