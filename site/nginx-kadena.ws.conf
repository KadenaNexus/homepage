# kadena.ws: canonical HTTPS hostname is https://kadena.ws.
# The certificate must cover both kadena.ws and www.kadena.ws.
server {
    listen 80;
    listen [::]:80;
    server_name kadena.ws www.kadena.ws;
    return 301 https://kadena.ws$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kadena.ws;

    ssl_certificate /etc/letsencrypt/live/kadena.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kadena.ws/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kadena.ws$request_uri;
}

server {
    include /etc/nginx/snippets/kadena-crawler-proxy.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kadena.ws;
    root /var/www/kadena.ws;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kadena.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kadena.ws/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /privacy-policy {
        try_files /privacy-policy.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
