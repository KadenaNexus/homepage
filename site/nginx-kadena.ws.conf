# /etc/nginx/sites-available/kadena.ws
server {
    listen 80;
    listen [::]:80;
    server_name kadena.ws www.kadena.ws;
    root /var/www/kadena.ws;
    index index.html;

    # www -> bare domain
    if ($host = www.kadena.ws) {
        return 301 https://kadena.ws$request_uri;
    }

    # clean URL for the privacy policy
    location = /privacy-policy {
        try_files /privacy-policy.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # certbot --nginx will add the 443 block and the http -> https redirect
}
