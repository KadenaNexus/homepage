name: deploy-static
on:
  workflow_call:
    inputs:
      source: { type: string, required: true }
      files: { type: string, required: true }
      target: { type: string, required: true }
      file_target: { type: boolean, default: false, required: false }
      url: { type: string, required: true }
    secrets:
      DEPLOY_HOST: { required: false }
      DEPLOY_USER: { required: false }
      DEPLOY_KEY: { required: false }
      DEPLOY_PATH: { required: false }
      PREVIEW_PATH: { required: false }
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify deployable files
        env:
          SOURCE: ${{ inputs.source }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          test -d "$SOURCE"
          for file in $FILES; do test -s "$SOURCE/$file"; done
  deploy:
    name: deploy
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      LIVE_PATH: ${{ secrets.DEPLOY_PATH }}
      EXPECTED_PATH: ${{ inputs.target }}
      PREVIEW_ROOT: ${{ secrets.PREVIEW_PATH }}
      SOURCE: ${{ inputs.source }}
      FILES: ${{ inputs.files }}
      FILE_TARGET: ${{ inputs.file_target }}
    steps:
      - name: Resolve and validate destination
        id: destination
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            test "$DEPLOY_HOST" = "89.167.14.58"
            test "$DEPLOY_USER" = "deployer"
            test -n "$DEPLOY_KEY"
            test "$LIVE_PATH" = "$EXPECTED_PATH" || { echo "::error::DEPLOY_PATH does not match the approved site root"; exit 1; }
            echo "path=$LIVE_PATH" >> "$GITHUB_OUTPUT"
            echo "mode=$FILE_TARGET" >> "$GITHUB_OUTPUT"
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_KEY" || -z "$PREVIEW_ROOT" ]]; then
              echo "::notice::Preview credentials or PREVIEW_PATH are not configured; skipping this branch."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$DEPLOY_HOST" = "89.167.14.58"
            test "$DEPLOY_USER" = "deployer"
            test "$PREVIEW_ROOT" = "/var/www/preview.kadena.ws"
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')
            repo_name=$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2)
            test -n "$slug"
            path="$PREVIEW_ROOT/$repo_name/$slug"
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "mode=false" >> "$GITHUB_OUTPUT"
            echo "preview_url=https://preview.kadena.ws/$repo_name/$slug/" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out caller repository
        if: steps.destination.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare pinned SSH connection
        if: steps.destination.outputs.skip != 'true'
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          89.167.14.58 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmNdcA2rlIHynqX/PNVjT+fDPFVwmhc1WDE6QN0kLel
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Copy files without deleting server-owned data
        if: steps.destination.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.destination.outputs.path }}
          MODE: ${{ steps.destination.outputs.mode }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)
          if [[ "$MODE" == "true" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            [[ "$FILES" == "index.html" ]] || { echo "::error::File deployment is limited to index.html"; exit 1; }
            "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$TARGET'"
            "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$TARGET'" < "$SOURCE/index.html"
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET'"
            else
              "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$TARGET'"
            fi
            for file in $FILES; do
              rsync -av --chmod=F644 \
                -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=15" \
                "$SOURCE/$file" "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/"
            done
          fi
      - name: Check the live site
        if: steps.destination.outputs.live == 'true'
        env:
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL" || true)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Live site returned HTTP $code" >&2
          exit 1
      - name: Print preview link
        if: steps.destination.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ steps.destination.outputs.preview_url }}
        run: 'echo "Preview: $PREVIEW_URL"'
