name: deploy
on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:
  # Daily rebuild of /news/, the live facts on the homepage, /faq/ and /buy-kda/, and the network reports
  # (new chain data collected weekly), from public data, deployed without a commit.
  schedule:
    - cron: "17 3 * * *"
jobs:
  site:
    uses: ./.github/workflows/deploy-static.yml
    with:
      source: site
      files: "index.html logo-kadena-nexus.png privacy-policy.html favicon.ico apple-touch-icon.png nexus-mark.png og robots.txt sitemap.xml llms.txt community-edition buy-kda faq news reports"
      build: "python3 scripts/update_facts.py && python3 scripts/build_news.py && python3 scripts/report/update_reports.py"
      target: /var/www/kadena.ws
      url: https://kadena.ws/
    secrets: inherit
